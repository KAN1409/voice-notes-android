name: Noter Android APK

on:
  push:
    branches: [ "feature/noter-rebuild" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/whisper.android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noter-debug-apk
          path: examples/whisper.android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
